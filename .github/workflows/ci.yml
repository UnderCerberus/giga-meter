name: ci
on:
  push:
  workflow_dispatch:
jobs:
  test:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - run: swift test --package-path GigaKit
  build:
    needs: test
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - run: brew install xcodegen
      - run: xcodegen generate
      - run: >
          xcodebuild
          -project GigaMeter.xcodeproj
          -scheme GigaMeter
          -configuration Release
          -sdk iphoneos
          -derivedDataPath build
          CODE_SIGNING_ALLOWED=NO
          build
      - name: Package IPA
        run: |
          mkdir Payload
          cp -R build/Build/Products/Release-iphoneos/GigaMeter.app Payload/
          zip -qry GigaMeter.ipa Payload
      - uses: actions/upload-artifact@v4
        with:
          name: GigaMeter-ipa
          path: GigaMeter.ipa
