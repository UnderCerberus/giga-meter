name: GigaProbe
options:
  bundleIdPrefix: com.undercerberus
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    TARGETED_DEVICE_FAMILY: "1"
packages:
  ProbeKit:
    path: ProbeKit
targets:
  GigaProbe:
    type: application
    platform: iOS
    sources: [Probe]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.undercerberus.gigaprobe
    dependencies:
      - package: ProbeKit
      - target: GigaProbeWidget
    entitlements:
      path: Probe/GigaProbe.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.undercerberus.gigaprobe
    info:
      path: Probe/Info.plist
      properties:
        CFBundleDisplayName: GigaProbe
        CFBundleShortVersionString: "0.1"
        CFBundleVersion: "1"
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        UIBackgroundModes: [fetch]
        BGTaskSchedulerPermittedIdentifiers:
          - com.undercerberus.gigaprobe.refresh
  GigaProbeWidget:
    type: app-extension
    platform: iOS
    sources: [ProbeWidget]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.undercerberus.gigaprobe.widget
    dependencies:
      - package: ProbeKit
    entitlements:
      path: ProbeWidget/GigaProbeWidget.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.undercerberus.gigaprobe
    info:
      path: ProbeWidget/Info.plist
      properties:
        CFBundleDisplayName: GigaProbe
        CFBundleShortVersionString: "0.1"
        CFBundleVersion: "1"
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
schemes:
  GigaProbe:
    build:
      targets:
        GigaProbe: all
