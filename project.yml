name: GigaMeter
options:
  bundleIdPrefix: com.undercerberus
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    TARGETED_DEVICE_FAMILY: "1"
packages:
  GigaKit:
    path: GigaKit
targets:
  GigaMeter:
    type: application
    platform: iOS
    sources: [GigaMeter]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.undercerberus.gigameter
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    dependencies:
      - package: GigaKit
        product: GigaCore
      - package: GigaKit
        product: ProbeKit
    info:
      path: GigaMeter/Info.plist
      properties:
        CFBundleDisplayName: ギガメーター
        CFBundleShortVersionString: "1.0"
        CFBundleVersion: "1"
        UILaunchScreen:
          UIColorName: LaunchBackground
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        UIUserInterfaceStyle: Dark
        UIBackgroundModes: [fetch]
        BGTaskSchedulerPermittedIdentifiers:
          - com.undercerberus.gigameter.refresh
schemes:
  GigaMeter:
    build:
      targets:
        GigaMeter: all
