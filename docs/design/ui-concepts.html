<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ギガメーター デザイン案</title>
<style>
  * { box-sizing: border-box; margin: 0; }
  body { background: #E9E8E4; color: #1A1B1E; font-family: -apple-system, "Hiragino Sans", "Yu Gothic UI", "Segoe UI", sans-serif; padding: 24px 16px 40px; }
  .note { text-align: center; font-size: 13px; color: #5D5E62; margin-bottom: 24px; }
  .row { display: flex; flex-wrap: wrap; gap: 28px; justify-content: center; }
  figure { width: 300px; }
  figcaption { text-align: center; margin-bottom: 12px; }
  figcaption b { display: block; font-size: 16px; }
  figcaption span { font-size: 12px; color: #5D5E62; }
  .phone { height: 620px; border-radius: 40px; padding: 28px 22px 22px; overflow: hidden; display: flex; flex-direction: column; border: 6px solid #111; }
  .num { font-variant-numeric: tabular-nums; }
  .bars { display: flex; align-items: flex-end; gap: 3px; }
  .bars i { flex: 1; display: block; border-radius: 2px; min-height: 2px; }
  .spacer { flex: 1; }

  .a { background: #0B0D10; color: #F3F5F7; }
  .a .label { font-size: 13px; color: #8B9098; }
  .a .gauge { position: relative; width: 220px; height: 220px; margin: 22px auto 18px; }
  .a .gauge div { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; }
  .a .big { font-size: 54px; font-weight: 700; letter-spacing: -1px; line-height: 1; }
  .a .big small { font-size: 18px; font-weight: 500; margin-left: 3px; }
  .a .tag { font-size: 11px; color: #C6F432; margin-top: 8px; }
  .a .cards { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 8px; }
  .a .card { background: #171A1F; border-radius: 14px; padding: 12px 10px; }
  .a .card b { display: block; font-size: 17px; margin-top: 4px; }
  .a .card span { font-size: 11px; color: #8B9098; }
  .a .bars { height: 70px; margin-top: 20px; }
  .a .bars i { background: #C6F432; }
  .a .bars i.f { background: #23272E; }
  .a .btn { margin-top: 16px; text-align: center; font-size: 13px; color: #C6F432; }

  .b { background: #F7F6F2; color: #16181C; }
  .b .label { font-size: 13px; color: #74757A; }
  .b .big { font-size: 64px; font-weight: 700; letter-spacing: -2px; line-height: 1.1; margin-top: 4px; }
  .b .big small { font-size: 20px; font-weight: 500; letter-spacing: 0; margin-left: 4px; }
  .b .say { font-size: 15px; margin-top: 8px; }
  .b .say b { color: #D9472F; }
  .b .bars { height: 210px; margin-top: 30px; gap: 2px; }
  .b .bars i { background: #16181C; }
  .b .bars i.t { background: #D9472F; }
  .b .bars i.f { background: #E2E0D9; }
  .b .axis { display: flex; justify-content: space-between; font-size: 11px; color: #74757A; margin-top: 6px; }
  .b .line { display: flex; justify-content: space-between; padding: 12px 0; border-top: 1px solid #DEDCD5; font-size: 14px; }
  .b .btn { text-align: center; font-size: 13px; color: #D9472F; margin-top: 8px; }

  .c { background: #1729E8; color: #fff; }
  .c .label { font-size: 13px; opacity: .75; }
  .c .big { font-size: 104px; font-weight: 800; letter-spacing: -5px; line-height: .95; margin-top: 30px; }
  .c .unit { font-size: 22px; font-weight: 600; margin-top: 6px; }
  .c .track { height: 12px; border-radius: 6px; background: rgba(255,255,255,.22); margin-top: 34px; position: relative; }
  .c .track i { position: absolute; left: 0; top: 0; bottom: 0; width: 50%; border-radius: 6px; background: #fff; }
  .c .ends { display: flex; justify-content: space-between; font-size: 12px; margin-top: 8px; opacity: .85; }
  .c .pred { font-size: 13px; opacity: .75; margin-top: 30px; }
  .c .pred + b { font-size: 34px; font-weight: 700; display: block; }
  .c .pair { display: flex; gap: 28px; margin-top: 18px; font-size: 13px; }
  .c .pair b { display: block; font-size: 20px; margin-top: 2px; }
  .c .pair span { opacity: .75; }
  .c .btn { background: #fff; color: #1729E8; font-size: 14px; font-weight: 600; text-align: center; padding: 13px; border-radius: 14px; }
</style>
</head>
<body>
<p class="note">数字はすべて見本(11月15日時点の想定)</p>
<div class="row">
  <figure>
    <figcaption><b>A. メーター</b><span>黒地に発光色。計器のような精密さ</span></figcaption>
    <div class="phone a">
      <div class="label">11月の使用量</div>
      <div class="gauge">
        <svg viewBox="0 0 220 220" width="220" height="220" aria-hidden="true">
          <circle cx="110" cy="110" r="96" fill="none" stroke="#23272E" stroke-width="14"/>
          <circle cx="110" cy="110" r="96" fill="none" stroke="#C6F432" stroke-width="14" stroke-linecap="round" stroke-dasharray="301.6 603.2" transform="rotate(-90 110 110)"/>
        </svg>
        <div><span class="big num">12.4<small>GB</small></span><span class="tag">実測</span></div>
      </div>
      <div class="cards">
        <div class="card"><span>月末予測</span><b class="num">24.8</b></div>
        <div class="card"><span>今日</span><b class="num">0.9</b></div>
        <div class="card"><span>先月</span><b class="num">21.3</b></div>
      </div>
      <div class="bars" data-style="a"></div>
      <div class="spacer"></div>
      <div class="btn">キャリアの数字に合わせる</div>
    </div>
  </figure>

  <figure>
    <figcaption><b>B. グラフ主役</b><span>紙のような白地。毎日の使い方が一目で分かる</span></figcaption>
    <div class="phone b">
      <div class="label">11月の使用量</div>
      <div class="big num">12.4<small>GB</small></div>
      <div class="say">このペースなら月末 <b class="num">24.8GB</b></div>
      <div class="bars" data-style="b"></div>
      <div class="axis"><span>1日</span><span>15日</span><span>30日</span></div>
      <div class="spacer"></div>
      <div class="line"><span>今日</span><b class="num">0.9GB</b></div>
      <div class="line"><span>先月</span><b class="num">21.3GB</b></div>
      <div class="btn">キャリアの数字に合わせる</div>
    </div>
  </figure>

  <figure>
    <figcaption><b>C. 大きな数字</b><span>鮮やかな単色と特大の数字。開いた瞬間に読める</span></figcaption>
    <div class="phone c">
      <div class="label">11月の使用量</div>
      <div class="big num">12.4</div>
      <div class="unit">GB</div>
      <div class="track"><i></i></div>
      <div class="ends"><span>11月1日</span><span>今日 15日</span><span>30日</span></div>
      <div class="pred">月末予測</div>
      <b class="num">24.8GB</b>
      <div class="pair">
        <div><span>今日</span><b class="num">0.9GB</b></div>
        <div><span>先月</span><b class="num">21.3GB</b></div>
      </div>
      <div class="spacer"></div>
      <div class="btn">キャリアの数字に合わせる</div>
    </div>
  </figure>
</div>
<script>
  const days = [.6,.9,1.2,.4,.7,1.1,.8,.5,1.3,.6,.9,.7,1.0,.8,.9];
  const pace = 12.4 / 15;
  document.querySelectorAll('.bars').forEach(box => {
    for (let d = 0; d < 30; d++) {
      const bar = document.createElement('i');
      const value = d < days.length ? days[d] : pace;
      bar.style.height = (value / 1.3 * 100) + '%';
      if (d >= days.length) bar.className = 'f';
      else if (d === days.length - 1) bar.className = 't';
      box.appendChild(bar);
    }
  });
</script>
</body>
</html>
